# List the first documents of a collection and query open orders. Read-only.
#   export GOOGLE_SERVICE_ACCOUNT_JSON=/path/to/key.json FIRESTORE_PROJECT_ID=my-project
#   graphrt run firestore/example.yaml --plugins .
version: "1"
name: firestore-demo
graph:
  nodes:
    - { id: start, type: start }
    - { id: users, type: firestore.list_documents, collection_path: users, limit: 5 }
    - id: open_orders
      type: firestore.run_query
      collection_id: orders
      where: [{ field: status, op: "==", value: open }]
      limit: 10
    - { id: answer, type: answer, answer: "Users: {{#users.data.documents#}} | open orders: {{#open_orders.data.count#}}" }
  edges:
    - { source: start, target: users }
    - { source: users, target: open_orders }
    - { source: open_orders, target: answer }
