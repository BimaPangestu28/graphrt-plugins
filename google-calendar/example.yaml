# Find free one-hour slots in the next week of your primary calendar (read-only).
#   GOOGLE_REFRESH_TOKEN=... GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=... graphrt run google-calendar/example.yaml --plugins .
#   or: GOOGLE_SERVICE_ACCOUNT_JSON=/path/to/key.json graphrt run google-calendar/example.yaml --plugins .
version: "1"
name: google-calendar-demo
graph:
  nodes:
    - { id: start, type: start }
    - id: slots
      type: google-calendar.find_free_slots
      time_min: "2026-11-23"
      time_max: "2026-11-28"
      time_zone: "Asia/Jakarta"
      duration_minutes: 60
      buffer_minutes: 15
      working_hours: { mon: ["09:00-12:00", "13:00-17:00"], tue: ["09:00-17:00"], wed: ["09:00-17:00"], thu: ["09:00-17:00"], fri: ["09:00-11:30"] }
    - { id: answer, type: answer, answer: "Free slots: {{#slots.data.slots#}}" }
  edges:
    - { source: start, target: slots }
    - { source: slots, target: answer }
