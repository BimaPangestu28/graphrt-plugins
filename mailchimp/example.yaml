# Check the key and list the first five audiences with their member counts. Read-only.
#   MAILCHIMP_API_KEY=...-us21 graphrt run mailchimp/example.yaml --plugins .
version: "1"
name: mailchimp-demo
graph:
  nodes:
    - { id: start, type: start }
    - { id: health, type: mailchimp.ping }
    - { id: audiences, type: mailchimp.list_audiences, limit: 5, fields: [lists.id, lists.name, lists.stats.member_count, total_items] }
    - { id: answer, type: answer, answer: "{{#health.data.health_status#}} audiences: {{#audiences.data#}}" }
  edges:
    - { source: start, target: health }
    - { source: health, target: audiences }
    - { source: audiences, target: answer }
