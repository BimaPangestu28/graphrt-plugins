# List the Mistral models your API key can use. Read-only and free.
#   MISTRAL_API_KEY=... graphrt run mistral/example.yaml --plugins .
version: "1"
name: mistral-demo
graph:
  nodes:
    - { id: start, type: start }
    - { id: models, type: mistral.list_models }
    - { id: answer, type: answer, answer: "Models: {{#models.data#}}" }
  edges:
    - { source: start, target: models }
    - { source: models, target: answer }
