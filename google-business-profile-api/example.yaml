# List my Business Profile accounts and the locations of the first one.
#   GOOGLE_REFRESH_TOKEN=... GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=... graphrt run google-business-profile-api/example.yaml --plugins .
# The token needs the https://www.googleapis.com/auth/business.manage scope, and Google must have approved API access.
version: "1"
name: google-business-profile-demo
graph:
  nodes:
    - { id: start, type: start }
    - { id: accounts, type: google-business-profile-api.list_accounts, limit: 5 }
    - { id: locations, type: google-business-profile-api.list_locations, account_id: "-", limit: 5 }
    - { id: answer, type: answer, answer: "Accounts: {{#accounts.data#}}\nLocations: {{#locations.data#}}" }
  edges:
    - { source: start, target: accounts }
    - { source: accounts, target: locations }
    - { source: locations, target: answer }
