# List the buckets the credentials can see, then the first page of objects in the first bucket. Read-only.
#   export AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... AWS_REGION=eu-west-1
#   (R2/MinIO: S3_ENDPOINT=... S3_ACCESS_KEY_ID=... S3_SECRET_ACCESS_KEY=...)
#   graphrt run s3/example.yaml --plugins .
version: "1"
name: s3-demo
graph:
  nodes:
    - { id: start, type: start }
    - { id: buckets, type: s3.list_buckets }
    - { id: objects, type: s3.list_objects, bucket: "{{#buckets.data.buckets.0.name#}}", delimiter: "/", limit: 20 }
    - { id: answer, type: answer, answer: "Buckets: {{#buckets.data.buckets#}} | first bucket: {{#objects.data#}}" }
  edges:
    - { source: start, target: buckets }
    - { source: buckets, target: objects }
    - { source: objects, target: answer }
