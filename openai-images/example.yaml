# List the models your OpenAI key can use. Read-only and free (no image is generated).
#   OPENAI_API_KEY=sk-... graphrt run openai-images/example.yaml --plugins .
version: "1"
name: openai-images-demo
graph:
  nodes:
    - { id: start, type: start }
    - { id: models, type: openai-images.list_models }
    - { id: answer, type: answer, answer: "Models: {{#models.data#}}" }
  edges:
    - { source: start, target: models }
    - { source: models, target: answer }
