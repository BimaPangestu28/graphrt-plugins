# Publishes plugin releases and refreshes the `catalog` release.
#
# - Push a tag `<plugin>-v<version>` (matching that plugin's graphrt-plugin.json) to
#   publish that plugin, or
# - run it by hand (workflow_dispatch) to publish every plugin whose version has no
#   release yet; existing releases are never modified.
# Every run also ingests community-plugins.json: new entries are verified and mirrored to
# `community-<name>-v<version>` releases (see docs/community-plugins.md).
# Locally, the same thing is `node scripts/publish-plugins.mjs` with an authenticated gh.
name: Release plugins

on:
  push:
    tags: ["*-v[0-9]*"]
  workflow_dispatch:
    inputs:
      plugins:
        description: "Space-separated plugin names (empty: all plugins)"
        required: false
        default: ""
      dry_run:
        description: "Pack, test and verify only"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read # the wait-for-earlier-runs step lists this workflow's runs

# Runs must not overlap: each one rebuilds and re-uploads the `catalog` release from what is published.
# A single shared group would serialize them, but GitHub keeps only the newest *pending* run of a group and
# cancels the others, so of several tags pushed together the middle ones would never publish. Each tag (and
# each manual run) therefore gets a group of its own, and the first step waits for every earlier run instead.
concurrency:
  group: release-plugins-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    # `community-<name>-v<version>` tags are mirror releases created by publish-plugins.mjs, not plugins of this repo.
    if: github.event_name != 'push' || !startsWith(github.ref_name, 'community-')
    runs-on: ubuntu-latest
    # Up to 60 minutes waiting for earlier runs, then the publish itself.
    timeout-minutes: 90
    steps:
      # Queue behind every earlier run of this workflow that has not finished (run ids grow with creation time).
      - name: Wait for earlier release runs
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          while true; do
            earlier_runs="$(gh api "repos/$REPOSITORY/actions/workflows/release.yml/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.id < $RUN_ID and .status != \"completed\") | .id] | join(\" \")")"
            if [ -z "$earlier_runs" ]; then break; fi
            echo "waiting for earlier run(s): $earlier_runs"
            sleep 15
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Without the plugins' own node_modules, dependency-backed plugin tests would fail or skip at publish time.
      - name: Install plugin dependencies
        run: scripts/install-plugin-dependencies.sh

      # Lenient for community-plugins.json: an invalid entry is an error annotation and the publish skips it,
      # so it never blocks official releases. Pull requests get the strict `npm run check` (ci.yml).
      - name: Check generated files
        run: npm run check:release

      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - name: Test release tooling
        run: node --test scripts/test/*.test.mjs

      # The catalog signing key comes from the GRAPHRT_CATALOG_SIGNING_KEY secret (the unencrypted minisign
      # secret key file). It is written to a mode-600 file under RUNNER_TEMP and never echoed. Without the secret
      # the variable stays unset, so a real publish refuses to upload an unsigned catalog (a dry run warns).
      - name: Write the catalog signing key
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.GRAPHRT_CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CATALOG_SIGNING_KEY" ]; then
            echo "::warning::secret GRAPHRT_CATALOG_SIGNING_KEY is not set; the catalog cannot be signed"
            exit 0
          fi
          umask 077
          key_file="$RUNNER_TEMP/catalog-minisign.key"
          printf '%s\n' "$CATALOG_SIGNING_KEY" > "$key_file"
          chmod 600 "$key_file"
          echo "GRAPHRT_CATALOG_SIGNING_KEY=$key_file" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GRAPHRT_PLUGINS_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PLUGINS: ${{ inputs.plugins }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          publish_args=()
          if [ "$EVENT_NAME" = "push" ]; then
            plugin_name="${REF_NAME%-v*}"
            tag_version="${REF_NAME##*-v}"
            # The name comes from the tag: the script validates it and reads the manifest with fs (no code interpolation).
            manifest_version="$(node scripts/read-manifest-version.mjs "$plugin_name")"
            if [ "$manifest_version" != "$tag_version" ]; then
              echo "::error::tag $REF_NAME does not match ${plugin_name}/graphrt-plugin.json version $manifest_version"
              exit 1
            fi
            publish_args+=("$plugin_name")
          else
            # Word splitting is intended; the script rejects unknown names.
            # shellcheck disable=SC2206
            publish_args+=($INPUT_PLUGINS)
            if [ "$INPUT_DRY_RUN" = "true" ]; then publish_args+=(--dry-run); fi
          fi
          node scripts/publish-plugins.mjs "${publish_args[@]}"

      - name: Keep the built tarballs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-dist
          path: |
            dist/*.tar.gz
            dist/catalog/
          if-no-files-found: ignore

      - name: Remove the catalog signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/catalog-minisign.key"
