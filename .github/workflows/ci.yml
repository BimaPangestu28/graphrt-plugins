# Runs on every pull request and on pushes to main: generated files must be in sync,
# no plugin may use a graphrt-reserved parameter name, every plugin's tests pass, and the
# WebAssembly modules built from their source pass the parity tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install plugin dependencies
        run: scripts/install-plugin-dependencies.sh

      - name: Check generated files
        run: npm run check

      # Shared tests, every plugin's tests, the sync check and the reserved-parameter check.
      # Integration tests that need ffmpeg, tesseract, a browser, sshd or a database skip cleanly here.
      - name: Test
        run: npm test

  wasm:
    name: WebAssembly modules from source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # rust-toolchain.toml pins the toolchain and the wasm32 target; rustup installs them on first use.
      # The bytes differ between host platforms (LLVM on Linux and macOS inlines differently), so this rebuilds
      # the modules and runs the Node.js parity tests against them instead of comparing bytes.
      - name: Build the modules
        run: |
          wasm/crates/supabase/build.sh
          wasm/crates/rest-kit/build.sh

      - name: rest-kit unit and ABI tests
        working-directory: wasm/crates
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --check

      - name: Parity tests against the fresh build
        run: node --test wasm/test/*.test.mjs
