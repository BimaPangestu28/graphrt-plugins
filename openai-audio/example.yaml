# List the OpenAI models the key can use (look for tts-*, *-transcribe, whisper-1). Read-only and free.
#   OPENAI_API_KEY=... graphrt run openai-audio/example.yaml --plugins .
version: "1"
name: openai-audio-demo
graph:
  nodes:
    - { id: start, type: start }
    - { id: models, type: openai-audio.list_models }
    - { id: answer, type: answer, answer: "Models: {{#models.data#}}" }
  edges:
    - { source: start, target: models }
    - { source: models, target: answer }
