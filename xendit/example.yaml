# Read the cash balance and the five newest invoices. Read-only; use a test-mode key (xnd_development_...).
#   XENDIT_SECRET_KEY=xnd_development_... graphrt run xendit/example.yaml --plugins .
version: "1"
name: xendit-demo
graph:
  nodes:
    - { id: start, type: start }
    - { id: balance, type: xendit.get_balance, account_type: CASH }
    - { id: invoices, type: xendit.list_invoices, limit: 5 }
    - { id: answer, type: answer, answer: "Balance: {{#balance.data.balance#}} | invoices: {{#invoices.data#}}" }
  edges:
    - { source: start, target: balance }
    - { source: balance, target: invoices }
    - { source: invoices, target: answer }
