# Active users and sessions by country over the last 7 days. Read-only. Set property_id to one of your GA4
# properties (list_account_summaries shows them as properties/<id>).
#   GOOGLE_REFRESH_TOKEN=... GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=... graphrt run google-analytics/example.yaml --plugins .
version: "1"
name: google-analytics-demo
graph:
  nodes:
    - { id: start, type: start }
    - id: report
      type: google-analytics.run_report
      property_id: "123456789"
      dimensions: [country]
      metrics: [activeUsers, sessions]
      date_ranges: [{ startDate: 7daysAgo, endDate: today }]
      order_bys: [{ metric: { metricName: activeUsers }, desc: true }]
      limit: 10
    - { id: answer, type: answer, answer: "{{#report.data.rowCount#}} countries: {{#report.data.rows#}}" }
  edges:
    - { source: start, target: report }
    - { source: report, target: answer }
