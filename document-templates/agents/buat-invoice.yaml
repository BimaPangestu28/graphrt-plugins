# Agent siap pakai "Buat invoice": tidak ada langkah yang memakai model AI.
# Agent ini menanyakan klien, daftar item, pajak dan mata uang, memeriksa semuanya lebih dulu (kesalahan
# disampaikan dengan kata-kata biasa dan tidak ada yang dibuat), meminta persetujuan sebelum membuat apa pun,
# lalu membuat PDF dengan template invoice bawaan di folder tahun/bulan dengan nomor invoice berikutnya,
# dan memberi tahu di mana filenya. Nomor baru terpakai setelah PDF tersimpan, jadi urutan nomor invoice
# tidak pernah bolong.
#   graphrt run document-templates/agents/buat-invoice.yaml --plugins . -i client_name="PT Maju Bersama" -i seller_name="CV Kenanga Digital"
version: "1"
name: buat-invoice
description: Membuat invoice PDF dengan nomor urut berikutnya, setelah Anda setujui, lalu memberi tahu di mana filenya.
graph:
  nodes:
    - id: start
      type: start
      variables:
        - { variable: client_name, type: text-input, required: true, max_length: 200, label: Nama klien }
        - { variable: client_address, type: paragraph, required: false, max_length: 600, label: Alamat klien }
        - variable: items
          type: json
          required: true
          label: "Daftar item (deskripsi, jumlah, satuan, harga satuan)"
          json_schema:
            type: array
            items:
              type: object
              properties:
                description: { type: string, title: Deskripsi }
                quantity: { type: number, title: Jumlah }
                unit: { type: string, title: Satuan }
                unit_price: { type: number, title: Harga satuan }
              required: [description, quantity, unit_price]
          default:
            - { description: Jasa konsultasi, quantity: 8, unit: jam, unit_price: 350000 }
            - { description: Hosting situs web, quantity: 1, unit: bulan, unit_price: 250000 }
        - { variable: tax_name, type: text-input, required: false, max_length: 40, label: Nama pajak, default: PPN }
        - { variable: tax_percent, type: number, required: false, label: Tarif pajak dalam persen (kosongkan bila tanpa pajak) }
        - { variable: currency, type: text-input, required: true, max_length: 3, label: "Mata uang (IDR, USD, SGD...)", default: IDR }
        - { variable: seller_name, type: text-input, required: true, max_length: 200, label: Nama Anda atau nama usaha Anda }

    - id: check_invoice
      type: document-templates.check_values
      title: Periksa data invoice
      template: invoice
      number_pattern: "INV-{YYYY}-{SEQ:4}"
      values:
        currency: "{{#start.currency#}}"
        language: id
        seller: { name: "{{#start.seller_name#}}" }
        client: { name: "{{#start.client_name#}}", address: "{{#start.client_address#}}" }
        items: "{{#start.items#}}"
        taxes:
          - { name: "{{#start.tax_name#}}", rate: "{{#start.tax_percent#}}" }

    - id: is_ok
      type: if-else
      title: Apakah semuanya benar?
      cases:
        - case_id: ok
          logical_operator: and
          conditions:
            - { variable_selector: [check_invoice, data, problem], comparison_operator: empty }

    - id: list_details
      type: template-transform
      title: Tulis isi invoice dengan kata-kata biasa
      template: "Klien: {{ client }}\nMata uang: {{ currency }}\nPajak: {% if tax_percent is number %}{{ tax_name }} {{ tax_percent }}%{% else %}tidak ada{% endif %}\nItem:\n{% for item in items %}- {{ item.description }}{% if item.quantity is defined and item.unit_price is defined %}: {{ item.quantity }} {{ item.unit }} x {{ item.unit_price }}{% elif item.amount is defined %}: {{ item.amount }}{% endif %}\n{% endfor %}"
      variables:
        - { variable: client, value_selector: [start, client_name] }
        - { variable: currency, value_selector: [start, currency] }
        - { variable: tax_name, value_selector: [start, tax_name] }
        - { variable: tax_percent, value_selector: [start, tax_percent] }
        - { variable: items, value_selector: [start, items] }

    - id: approve
      type: human-input
      title: Tanya sebelum membuat invoice
      prompt: "Buat invoice ini? Nomornya {{#check_invoice.data.number#}} (atau nomor kosong berikutnya, bila ada invoice lain yang dibuat lebih dulu). Total tagihan: {{#check_invoice.data.totals.balance_due_text#}}.\n\n{{#list_details.output#}}"
      actions:
        - { id: create, title: Buat invoice }
        - { id: cancel, title: Batal }

    - id: create_pdf
      type: document-templates.render_pdf
      title: Buat dan simpan PDF invoice
      on_error: { strategy: fail-branch }
      template: invoice
      number_pattern: "INV-{YYYY}-{SEQ:4}"
      values:
        currency: "{{#start.currency#}}"
        language: id
        seller: { name: "{{#start.seller_name#}}" }
        client: { name: "{{#start.client_name#}}", address: "{{#start.client_address#}}" }
        items: "{{#start.items#}}"
        taxes:
          - { name: "{{#start.tax_name#}}", rate: "{{#start.tax_percent#}}" }

    - id: write_summary
      type: template-transform
      title: Beri tahu di mana invoicenya
      template: "Invoice {{ number }} untuk {{ client }} sudah jadi. Total tagihan: {{ total }}.\nDisimpan sebagai {{ path }}"
      variables:
        - { variable: number, value_selector: [create_pdf, data, number] }
        - { variable: client, value_selector: [start, client_name] }
        - { variable: total, value_selector: [create_pdf, data, totals, balance_due_text] }
        - { variable: path, value_selector: [create_pdf, data, path] }

    - id: write_cancelled
      type: template-transform
      title: Beri tahu bahwa tidak ada yang dibuat
      template: "Tidak ada invoice yang dibuat dan tidak ada nomor yang terpakai."
      variables: []

    - id: write_problem
      type: template-transform
      title: Beri tahu apa yang perlu diperbaiki
      template: "Tidak ada invoice yang dibuat dan tidak ada nomor yang terpakai, karena ada data yang perlu diperbaiki:\n{{ problem }}\nPerbaiki lalu jalankan agent ini lagi."
      variables:
        - { variable: problem, value_selector: [check_invoice, data, problem] }

    - id: write_failed
      type: template-transform
      title: Beri tahu bahwa invoice tidak bisa dibuat
      template: "Invoice tidak bisa dibuat, dan tidak ada nomor yang terpakai:\n{{ error }}"
      variables:
        - { variable: error, value_selector: [create_pdf, error_message] }

    - id: result
      type: variable-aggregator
      title: Hasil
      variables:
        - [write_summary, output]
        - [write_cancelled, output]
        - [write_problem, output]
        - [write_failed, output]

    - id: end
      type: end
      outputs:
        - { variable: summary, value_selector: [result, output] }

  edges:
    - { source: start, target: check_invoice }
    - { source: check_invoice, target: is_ok }
    - { source: is_ok, target: list_details, handle: ok }
    - { source: is_ok, target: write_problem, handle: "false" }
    - { source: list_details, target: approve }
    - { source: approve, target: create_pdf, handle: create }
    - { source: approve, target: write_cancelled, handle: cancel }
    - { source: create_pdf, target: write_summary }
    - { source: create_pdf, target: write_failed, handle: fail-branch }
    - { source: write_summary, target: result }
    - { source: write_cancelled, target: result }
    - { source: write_problem, target: result }
    - { source: write_failed, target: result }
    - { source: result, target: end }
