# List the models available on Groq. Read-only and free.
#   GROQ_API_KEY=gsk_... graphrt run groq/example.yaml --plugins .
version: "1"
name: groq-demo
graph:
  nodes:
    - { id: start, type: start }
    - { id: models, type: groq.list_models }
    - { id: answer, type: answer, answer: "Models: {{#models.data#}}" }
  edges:
    - { source: start, target: models }
    - { source: models, target: answer }
